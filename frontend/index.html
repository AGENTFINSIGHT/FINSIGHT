<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FinSight AI — Upload bank statements and get instant AI-powered spending analysis, category breakdowns, and personalized savings recommendations." />
    <meta name="theme-color" content="#0a0e1a" />
    <title>FinSight AI — AI Financial Assistant</title>

  <body>
    <div id="root"></div>
    <script>
      // Prevent flash of wrong theme
      (function() {
        var theme = localStorage.getItem('finsight-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
